<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA ERP</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#182338;font-family:Segoe UI,Arial,sans-serif}header{height:72px;background:#10213a;color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #10213a20}header h1{margin:0;font-size:22px}header small{color:#c3d2e6}header button{border:0;border-radius:9px;padding:12px 16px;background:#74b5ff;color:#10213a;font-weight:700;cursor:pointer}aside{width:230px;position:fixed;top:72px;bottom:0;background:#fff;border-right:1px solid #dce4ef;padding:14px;overflow:auto}nav button{display:block;width:100%;text-align:left;padding:14px;border:0;border-radius:10px;background:transparent;color:#33435d;font-weight:600;cursor:pointer;margin:3px 0}nav button:hover,nav button.active{background:#eaf2ff;color:#1658a7}main{margin-left:230px;padding:28px;max-width:1600px}h2{font-size:25px;margin:0 0 5px}h3{font-size:17px;margin:0 0 12px}.sub{color:#64748b;margin:0 0 20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:20px 0}.card,.panel{background:#fff;border:1px solid #e0e7f0;border-radius:14px;padding:18px;margin-bottom:17px;box-shadow:0 3px 10px #1b315008}.card small{color:#64748b}.card strong{font-size:27px;display:block;margin-top:8px}.panel{max-width:1200px}.panel p{color:#607086}.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.field label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:#44536b}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d2dce9;border-radius:9px;background:#fff;color:#172338;font-size:15px}.field textarea{min-height:70px}.hint{font-size:12px;color:#738197;margin-top:5px}.primary,.secondary{padding:11px 15px;border:0;border-radius:9px;cursor:pointer;font-weight:700}.primary{background:#2468c9;color:#fff}.secondary{background:#eaf1fa;color:#244568}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:500px}th,td{padding:11px 10px;border-bottom:1px solid #e5eaf1;text-align:left;font-size:14px}th{background:#f3f7fc;color:#516178;font-size:12px;text-transform:uppercase;letter-spacing:.04em}tbody tr:hover{background:#fafcff}.pill{display:inline-block;border-radius:20px;padding:4px 9px;background:#edf4ff;color:#245b9b;font-size:12px;font-weight:600}.warn{color:#a65b00}.empty{padding:25px;text-align:center;color:#65748b}.hidden{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#10213a;color:white;padding:14px 18px;border-radius:10px;display:none;z-index:10;max-width:400px}.danger{color:#b42318}@media(max-width:850px){aside{position:static;width:auto;padding:8px;border:0}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}main{margin:0;padding:14px}header{position:static}}
</style></head><body><header><div><h1>NEXORA <span style="color:#74b5ff">ERP</span></h1><small>Manufacturing operations made simple</small></div><button onclick="exportExcel()">⬇ Download Excel</button></header><aside><nav><button class="active" onclick="page('Dashboard',this)">◫ &nbsp;Dashboard</button><button onclick="page('Companies',this)">▦ &nbsp;Companies & Units</button><button onclick="page('Inventory',this)">▤ &nbsp;Inventory</button><button onclick="page('Production',this)">⚙ &nbsp;Production</button><button onclick="page('Wages',this)">₹ &nbsp;Piecework Wages</button><button onclick="page('Sales',this)">▣ &nbsp;Sales</button></nav><p class="hint">Enter information here. Excel reports are generated from your entries.</p></aside><main id="main"></main><div class="toast" id="toast"></div><script>
let data={},current='Dashboard';const main=document.getElementById('main');const today=new Date().toISOString().slice(0,10);async function refresh(){let r=await fetch('/api/data');data=await r.json();render()}function page(p,b){current=p;document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render()}function opts(list,label='name',id='id'){return list.map(x=>`<option value="${x[id]}">${x[label]}</option>`).join('')}function companySelect(n='company_id'){return `<select name="${n}" required data-company-select onchange="filterDependents(this.form)"><option value="">Select company</option>${opts(data.companies)}</select>`}function unitSelect(n='unit_id'){return `<select name="${n}" data-unit-select onchange="filterDependents(this.form)"><option value="">No unit / choose later</option>${opts(data.units)}</select>`}function itemSelect(n='item_id'){return `<select name="${n}" required data-item-select><option value="">Select product or item</option>${opts(data.items)}</select>`}function workerSelect(n='worker_id'){return `<select name="${n}" data-worker-select><option value="">Select worker</option>${opts(data.workers)}</select>`}function field(label,input,hint=''){return `<div class="field"><label>${label}</label>${input}${hint?`<div class="hint">${hint}</div>`:''}</div>`}function frm(fields,endpoint,button='Save'){return `<form onsubmit="submitForm(event,'${endpoint}')"><div class="formgrid">${fields}</div><div class="actions"><button class="primary">${button}</button></div></form>`}function panel(title,content,extra=''){return `<section class="panel"><h3>${title}</h3>${extra}${content}</section>`}function tbl(headers,rows){if(!rows.length)return `<div class="empty">No records yet. Add your first entry using the form above.</div>`;return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${v??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function note(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function filterDependents(form){if(!form)return;let co=form.querySelector('[data-company-select]')?.value||'';let unit=form.querySelector('[data-unit-select]');if(unit){let selected=unit.value;unit.innerHTML='<option value="">No unit / choose later</option>'+data.units.filter(u=>!co||u.company_id==co).map(u=>`<option value="${u.id}">${escapeHtml(u.name)}</option>`).join('');if(data.units.some(u=>u.id==selected&&(!co||u.company_id==co)))unit.value=selected;}let worker=form.querySelector('[data-worker-select]');if(worker){let sel=worker.value;worker.innerHTML='<option value="">Select worker</option>'+data.workers.filter(w=>!co||w.company_id==co).filter(w=>!unit?.value||w.unit_id==unit.value).map(w=>`<option value="${w.id}">${escapeHtml(w.name)}${w.unit?' · '+escapeHtml(w.unit):''}</option>`).join('');if(data.workers.some(w=>w.id==sel&&(!co||w.company_id==co)))worker.value=sel;}let item=form.querySelector('[data-item-select]');if(item){let sel=item.value;item.innerHTML='<option value="">Select product or item</option>'+data.items.filter(i=>!co||i.company_id==co||i.company_id==null).map(i=>`<option value="${i.id}">${escapeHtml(i.name)}${i.company_id==null?' · Shared catalog':''}${i.stock!==undefined?' · Stock '+i.stock+' '+escapeHtml(i.uom):''}</option>`).join('');if(data.items.some(i=>i.id==sel&&(!co||i.company_id==co)))item.value=sel;}}function companyReport(id){exportExcel(id)}function companyDetails(id){let c=data.companies.find(x=>x.id==id);let units=data.units.filter(u=>u.company_id==id),items=data.items.filter(i=>i.company_id==id),workers=data.workers.filter(w=>w.company_id==id),prod=data.production.filter(p=>p.company_id==id),sales=data.sales.filter(x=>x.company_id==id);main.innerHTML=`<h2>${escapeHtml(c.name)}</h2><button onclick="page('Companies')">← Back to companies</button><button class="primary" onclick="companyReport(${id})">Download company Excel</button><div class="cards">${[['Units',units.length],['Items',items.length],['Workers',workers.length],['Production entries',prod.length],['Sales records',sales.length]].map(x=>`<div class="card"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div>${panel('Factory units',tbl(['Unit'],units.map(u=>[u.name])))}${panel('Inventory',tbl(['Item','Unit','Stock','Alert'],items.map(i=>[i.name,i.uom,i.stock,i.min_stock])))}${panel('Workers',tbl(['Worker','Unit'],workers.map(w=>[w.name,w.unit||'—'])))}${panel('Production',tbl(['Date','Unit','Worker','Product','Produced','Rejected','Accepted'],prod.map(p=>[p.date,p.unit||'—',p.worker||'—',p.item,p.qty,p.rejected,p.qty-p.rejected])))}${panel('Sales',tbl(['Date','Shop/Customer','Item','Quantity','Total'],sales.map(x=>[x.date,x.customer,x.item,x.qty+' '+x.uom,'₹ '+x.total])))}`;current='CompanyDetails'}function render(){
if(current==='Dashboard'){let low=data.items.filter(i=>i.stock<=i.min_stock);main.innerHTML=`<h2>Dashboard</h2><p class="sub">A quick view of what's happening across your operations.</p><div class="cards">${[['Companies',data.companies.length],['Factory units',data.units.length],['Items',data.items.length],['Production entries',data.production.length],['Workers',data.workers.length],['Sales',data.sales.length],['Low stock',low.length]].map(x=>`<div class="card"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div>${panel('Recent production',tbl(['Date','Company','Unit','Worker','Product','Accepted'],data.production.slice(0,8).map(p=>[p.date,p.company,p.unit||'—',p.worker||'—',p.item,(p.qty-p.rejected)+' '+p.uom])))}${panel('Recent sales',tbl(['Date','Company','Shop','Item','Qty','Total'],data.sales.slice(0,8).map(x=>[x.date,x.company,x.customer,x.item,x.qty+' '+x.uom,'₹ '+x.total])))}`}
else if(current==='Companies'){main.innerHTML=`<h2>Companies & Units</h2><p class="sub">First add a company. Then add its factory or workshop.</p><div class="split">${panel('① Add a company',frm(field('Company name',`<input name="name" placeholder="e.g. Empire Furniture" required>`),'companies','Add company'))}${panel('② Add a factory unit',frm(field('Belongs to company',companySelect())+field('Factory / unit name',`<input name="name" placeholder="e.g. Main Factory" required>`),'units','Add unit'))}</div>${panel('Your companies',`<div class="companycards">${data.companies.map(c=>`<div class="card"><strong>${escapeHtml(c.name)}</strong><p>${data.units.filter(u=>u.company_id==c.id).length} factory unit(s)</p><button class="primary" onclick="companyReport(${c.id})">⬇ Download ${escapeHtml(c.name)} Excel</button><button onclick="companyDetails(${c.id})">View company data</button></div>`).join('')}</div>`)}${panel('Factory units',tbl(['Company','Factory / unit'],data.units.map(u=>[u.company,u.name])))}`}
else if(current==='Inventory'){main.innerHTML=`<h2>Inventory / Item List</h2><p class="sub">Add your products and materials here once. Assign company, factory and worker details when recording production.</p>${panel('Add item',frm(field('Item name',`<input name="name" placeholder="e.g. Wardrobe, 18mm board, hinge" required>`)+field('Item code (optional)',`<input name="code" placeholder="SKU or code">`)+field('Category (optional)',`<input name="category" placeholder="Raw material / finished product">`)+field('Unit',`<select name="uom"><option>pcs</option><option>sheets</option><option>kg</option><option>m</option><option>ft</option><option>litres</option><option>boxes</option></select>`),'items','Add item'))}${panel('Item list',tbl(['Item','Code','Category','Unit'],data.items.map(i=>[i.name,i.code||'—',i.category||'—',i.uom])))}`}
else if(current==='Production'){main.innerHTML=`<h2>Production</h2><p class="sub">Enter what was made. Accepted quantity is automatically calculated after rejection.</p>${panel('Quick production entry',frm(field('Company',companySelect())+field('Factory unit',unitSelect())+field('Worker (optional)',workerSelect())+field('Product',itemSelect())+field('Produced quantity',`<input type="number" min="0.01" step="0.01" name="qty" placeholder="Total produced" required>`)+field('Rejected quantity',`<input type="number" min="0" step="0.01" name="rejected" value="0" required>`)+field('Production date',`<input type="date" name="date" value="${today}" required>`)+field('Note (optional)',`<input name="note" placeholder="Shift / details">`),'production','Record production'))}${panel('Production register',tbl(['Date','Company','Unit','Worker','Product','Produced','Rejected','Accepted','Status'],data.production.map(p=>[p.date,p.company,p.unit||'—',p.worker||'—',p.item,p.qty+' '+p.uom,p.rejected+' '+p.uom,(p.qty-p.rejected)+' '+p.uom,p.status])))}`}
else if(current==='Wages'){main.innerHTML=`<h2>Piecework Wages</h2><p class="sub">Set a common rate across multiple factory units, then adjust individual workers in the editable rate sheet.</p><div class="split">${panel('① Add worker',frm(field('Company',companySelect())+field('Unit (optional)',unitSelect())+field('Worker name',`<input name="name" placeholder="Worker name" required>`),'workers','Add worker'))}${panel('② Individual rate (quick)',frm(field('Company',companySelect())+field('Factory unit',unitSelect())+field('Worker',workerSelect())+field('Product',itemSelect())+field('Rate per accepted unit',`<input type="number" min="0" step="0.01" name="rate" placeholder="₹ per piece" required>`),'rates','Save rate'))}</div>${panel('③ Bulk rates · select multiple units',`<div class="formgrid">${field('Company',`<select id="bulkCompany" onchange="renderBulkUnits()"><option value="">Select company</option>${opts(data.companies)}</select>`)}${field('Product',`<select id="bulkItem"><option value="">Select product</option>${opts(data.items.filter(i=>i.company_id!=null))}</select>`)}${field('Common rate (₹)',`<input id="bulkBaseRate" type="number" min="0" step="0.01" placeholder="Rate to apply across selected workers">`)}</div><div id="bulkUnits" style="margin:12px 0"></div><div class="actions"><button class="secondary" type="button" onclick="buildBulkRateSheet()">Show workers / apply common rate</button><button class="primary" type="button" onclick="saveBulkRates()">Save rate sheet</button></div><div id="bulkRateSheet"></div>`)}${panel('Gross wage summary',`<p class="hint">Gross amount is based on accepted quantities from approved production entries. This is not a payment/settlement record.</p>`+tbl(['Worker','Product','Rate','Accepted quantity','Gross earnings'],earnings()))}${panel('Workers',tbl(['Worker','Company','Unit'],data.workers.map(w=>[w.name,w.company,w.unit||'—'])))}${panel('Saved rates',tbl(['Worker','Product','Rate'],data.rates.map(r=>[r.worker,r.item,'₹ '+r.rate+' / '+r.uom])))}`}
else if(current==='Sales'){let totalSales=data.sales.reduce((a,x)=>a+Number(x.total||0),0);let grouped={};data.sales.forEach(x=>{let k=x.sale_group_id||x.id;if(!grouped[k])grouped[k]={date:x.date,company:x.company,shop:x.customer,lines:[],total:0};grouped[k].lines.push(x);grouped[k].total+=Number(x.total||0)});let orders=Object.values(grouped).sort((a,b)=>b.date.localeCompare(a.date));main.innerHTML=`<h2>Sales</h2><p class="sub">Register shops once, then record one sale with as many items as the shop purchased. Factory unit is not required here.</p><div class="cards"><div class="card"><small>Sales orders</small><strong>${orders.length}</strong></div><div class="card"><small>Sales line items</small><strong>${data.sales.length}</strong></div><div class="card"><small>Total recorded sales</small><strong>₹ ${totalSales.toFixed(2)}</strong></div></div><div class="split">${panel('① Add a shop / customer',frm(field('Shop name',`<input name="name" placeholder="Shop name" required>`)+field('Contact number (optional)',`<input name="contact" placeholder="Phone number">`)+field('Address (optional)',`<input name="address" placeholder="Shop address">`)+field('Notes (optional)',`<input name="note" placeholder="Additional details">`),'shops','Save shop'))}${panel('Registered shops',tbl(['Shop','Contact','Address'],data.shops.map(x=>[escapeHtml(x.name),escapeHtml(x.contact||'—'),escapeHtml(x.address||'—')])) )}</div>${panel('② Record a sale',`<form id="salesForm" onsubmit="submitForm(event,'sales')"><div class="formgrid">${field('Company',companySelect())}${field('Shop / customer',`<select name="shop_id" required><option value="">Select registered shop</option>${opts(data.shops)}</select>`)}${field('Sale date',`<input type="date" name="date" value="${today}" required>`)}${field('Invoice / notes (optional)',`<input name="note" placeholder="Invoice number or details">`)}</div><h3 style="margin-top:18px">Items in this bill</h3><div id="saleLines"></div><div id="saleTotal" style="font-weight:700;text-align:right;padding:12px">Bill total: ₹ 0.00</div><div class="actions"><button type="button" class="secondary" onclick="addSaleLine()">＋ Add another item</button><button class="primary">Save sale</button></div></form>`)}${panel('Sales register (grouped by sale)',tbl(['Date','Company','Shop','Items','Order total'],orders.map(o=>[o.date,o.company,o.shop,o.lines.map(l=>escapeHtml(l.item)+' × '+l.qty).join('<br>'),'₹ '+o.total.toFixed(2)])))}${panel('Sales line detail',tbl(['Date','Company','Shop','Item','Qty','Unit price','Line total','Notes'],data.sales.map(x=>[x.date,x.company,escapeHtml(x.customer),escapeHtml(x.item),x.qty,'₹ '+Number(x.unit_price).toFixed(2),'₹ '+Number(x.total).toFixed(2),x.note||'—'])))} `;addSaleLine();}}
function addSaleLine(){let box=document.getElementById('saleLines');if(!box)return;let div=document.createElement('div');div.className='sale-line';div.style.cssText='display:grid;grid-template-columns:minmax(220px,2fr) 110px 140px 130px auto;gap:10px;align-items:end;border:1px solid #dce4ef;border-radius:12px;padding:12px;margin:10px 0';div.innerHTML=`${field('Item',`<select name="item_id" required data-item-select><option value="">Select item</option>${opts(data.items.filter(i=>i.company_id!=null))}</select>`)}${field('Quantity',`<input name="qty" type="number" min="0.01" step="0.01" required placeholder="Qty" oninput="updateSalesTotals()">`)}${field('Rate (₹)',`<input name="unit_price" type="number" min="0" step="0.01" required placeholder="Price" oninput="updateSalesTotals()">`)}${field('Amount',`<input class="line-total" readonly value="₹ 0.00">`)}<button type="button" class="secondary" onclick="this.closest('.sale-line').remove();updateSalesTotals()">Remove</button>`;box.appendChild(div);updateSalesTotals()}function updateSalesTotals(){let sum=0;document.querySelectorAll('.sale-line').forEach(row=>{let q=Number(row.querySelector('[name=qty]').value||0),r=Number(row.querySelector('[name=unit_price]').value||0),t=q*r;row.querySelector('.line-total').value='₹ '+t.toFixed(2);sum+=t});let el=document.getElementById('saleTotal');if(el)el.textContent='Bill total: ₹ '+sum.toFixed(2)}function renderBulkUnits(){let co=Number(document.getElementById('bulkCompany')?.value||0),box=document.getElementById('bulkUnits');if(!box)return;let units=data.units.filter(u=>u.company_id==co);box.innerHTML=units.length?`<div style="display:flex;gap:12px;flex-wrap:wrap;padding:10px;border:1px solid #dce4ef;border-radius:10px">${units.map(u=>`<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" class="bulk-unit" value="${u.id}">${escapeHtml(u.name)}</label>`).join('')}</div><small class="hint">Select one or more units. Rate sheet includes workers in the selected units.</small>`:'Select a company to show its factory units.';document.getElementById('bulkRateSheet').innerHTML=''}function buildBulkRateSheet(){let co=Number(document.getElementById('bulkCompany')?.value||0),iid=Number(document.getElementById('bulkItem')?.value||0),unitIds=[...document.querySelectorAll('.bulk-unit:checked')].map(x=>Number(x.value)),base=Number(document.getElementById('bulkBaseRate')?.value);if(!co||!iid||!unitIds.length||!Number.isFinite(base)){note('Select company, product, units and enter a common rate.');return}let workers=data.workers.filter(w=>w.company_id==co&&unitIds.includes(Number(w.unit_id)));if(!workers.length){note('No workers found in selected units.');return}let sheet=document.getElementById('bulkRateSheet');sheet.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Worker</th><th>Unit</th><th>Current rate</th><th>New rate (editable)</th></tr></thead><tbody>${workers.map(w=>{let existing=data.rates.find(r=>r.worker_id==w.id&&r.item_id==iid);return `<tr><td>${escapeHtml(w.name)}</td><td>${escapeHtml(w.unit||'—')}</td><td>${existing?'₹ '+existing.rate:'—'}</td><td><input class="bulk-worker-rate" data-worker="${w.id}" type="number" min="0" step="0.01" value="${base}" style="max-width:150px"></td></tr>`}).join('')}</tbody></table></div><p class="hint">Common rate is prefilled for every worker. Edit any row before saving to set unit/worker exceptions.</p>`}async function saveBulkRates(){let co=Number(document.getElementById('bulkCompany')?.value||0),iid=Number(document.getElementById('bulkItem')?.value||0),unitIds=[...document.querySelectorAll('.bulk-unit:checked')].map(x=>Number(x.value)),rows=[...document.querySelectorAll('.bulk-worker-rate')].map(x=>({worker_id:Number(x.dataset.worker),rate:x.value}));if(!co||!iid||!unitIds.length||!rows.length||rows.some(x=>x.rate==='')){note('Build the rate sheet first and check every rate.');return}let r=await fetch('/api/bulk-rates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({company_id:co,item_id:iid,unit_ids:unitIds,rows})}),res=await r.json();if(!r.ok){note(res.error||'Rates could not be saved');return}await refresh();note('Bulk rates saved.')}function filterDependents(form){if(!form)return;let co=form.querySelector('[data-company-select]')?.value||'';let unit=form.querySelector('[data-unit-select]');if(unit){let selected=unit.value;unit.innerHTML='<option value="">No unit / choose later</option>'+data.units.filter(u=>!co||u.company_id==co).map(u=>`<option value="${u.id}">${escapeHtml(u.name)}</option>`).join('');if(data.units.some(u=>u.id==selected&&(!co||u.company_id==co)))unit.value=selected;}let worker=form.querySelector('[data-worker-select]');if(worker){let sel=worker.value;worker.innerHTML='<option value="">Select worker</option>'+data.workers.filter(w=>!co||w.company_id==co).filter(w=>!unit?.value||w.unit_id==unit.value).map(w=>`<option value="${w.id}">${escapeHtml(w.name)}${w.unit?' · '+escapeHtml(w.unit):''}</option>`).join('');if(data.workers.some(w=>w.id==sel&&(!co||w.company_id==co)))worker.value=sel;}let itemSelects=form.querySelectorAll('[data-item-select]');itemSelects.forEach(item=>{let sel=item.value;item.innerHTML='<option value="">Select product or item</option>'+data.items.filter(i=>!co||i.company_id==co||i.company_id==null).map(i=>`<option value="${i.id}">${escapeHtml(i.name)}${i.company_id==null?' · Shared catalog':''}${i.stock!==undefined?' · Stock '+i.stock+' '+escapeHtml(i.uom):''}</option>`).join('');if(data.items.some(i=>i.id==sel&&(!co||i.company_id==co||i.company_id==null)))item.value=sel;});}
function earnings(){return data.rates.map(r=>{let ps=data.production.filter(p=>p.worker_id==r.worker_id&&p.item_id==r.item_id&&p.status==='Approved');let q=ps.reduce((s,p)=>s+Math.max(0,p.qty-p.rejected),0);return [r.worker,r.item,'₹ '+r.rate+' / '+r.uom,q,(q*r.rate).toFixed(2)]})}async function submitForm(e,path){e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());if(path==='sales'){d.lines=[...e.target.querySelectorAll('.sale-line')].map(row=>({item_id:row.querySelector('[name=item_id]').value,qty:row.querySelector('[name=qty]').value,unit_price:row.querySelector('[name=unit_price]').value}));if(!d.lines.length||d.lines.some(x=>!x.item_id||!x.qty||!x.unit_price)){note('Complete each product line before saving.');return;}}let endpoint=path;if(path==='movementReceipt')endpoint='/api/movement';if(path==='movementIssue')endpoint='/api/movement';if(path==='movementReceipt')d.kind='Receipt';if(path==='movementIssue'&&d.kind==='Issue'){}else if(path==='movementIssue'&&d.kind==='Adjustment'){}else if(path==='movementIssue')d.kind='Issue';let r=await fetch(endpoint.startsWith('/api')?endpoint:'/api/'+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});let res=await r.json();if(!r.ok){note(res.error||'Could not save entry');return}e.target.reset();await refresh();note('Saved successfully.');}async function exportExcel(companyId=null){try{let r=await fetch('/api/export'+(companyId?'?company_id='+companyId:''));if(!r.ok)throw new Error('Export failed');let blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=companyId?(data.companies.find(c=>c.id==companyId)?.name.replace(/[^a-z0-9]+/gi,'_')+'_Operations.xlsx'):'NEXORA_Operations.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);note('Excel workbook downloaded.')}catch(e){note('Excel download failed. Try again.')}}document.addEventListener('change',e=>{if(e.target.matches('[data-company-select],[data-unit-select]'))filterDependents(e.target.form)});refresh();
